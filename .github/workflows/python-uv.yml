name: Python CI Build

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      # 1. Install the uv package manager first
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # 2. Tell uv to set up Python 3.12
      - name: Setup Python
        run: uv python install 3.12

      # 3. Use uv to install dependencies (much faster than pip!)
      - name: Install Dependencies
        run: |
          # If you strictly use requirements.txt:
          uv pip install -r requirements.txt
          uv pip install pytest build
          
          # OR, if you use pyproject.toml natively, you can just run:
          # uv sync
          
      - name: Show workspace
        run: |
            echo "Workspace: $GITHUB_WORKSPACE"
            pwd
            ls -la
            find . -maxdepth 3 -type f
            
      - name: Test Python import
        run: |
            uv run python -c "import os; print(os.getcwd())" 
            uv run python -c "import sys; print(sys.path)"

      - name: Try importing app
        run: |
            uv run python -c "import app; print('Import successful')"
    
      - name: Run unit test
        run: |
          uv run pytest -v

      - name: Build Python Package
        run: |
          uv build
          
      - name: Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 2